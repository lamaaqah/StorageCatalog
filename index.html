<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="كتالوج منتجات مستودع 7 ومستودع 9 - استعرض جميع الصور بتصميم أنيق" />
  <title>كتالوج المستودعات | مستودع ٧ & مستودع ٩</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ══════════════════════════════════════════
       HEADER — Brand
  ══════════════════════════════════════════ -->
  <header class="header" role="banner">
    <div class="header-brand">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="white" stroke-width="1.8">
          <path d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>كتالوج المستودعات</h1>
        <p>تصفح واستعراض أصول ومحتويات المستودعات بسهولة وذكاء</p>
      </div>
    </div>
  </header>

  <!-- ══════════════════════════════════════════
       TOP BAR — Filters only
  ══════════════════════════════════════════ -->
  <header class="top-bar" role="banner">
    <nav class="filter-group" role="group" aria-label="فلاتر المستودع">
      <button id="filter-all" class="filter-btn active" data-filter="all" aria-pressed="true">
        <span><span class="count-badge" id="count-all">0</span>الكل</span>
      </button>
      <button id="filter-w7" class="filter-btn" data-filter="7" aria-pressed="false">
        <span><span class="count-badge" id="count-w7">0</span>مستودع ٧</span>
      </button>
      <button id="filter-w9" class="filter-btn" data-filter="9" aria-pressed="false">
        <span><span class="count-badge" id="count-w9">0</span>مستودع ٩</span>
      </button>
      <button id="filter-wg" class="filter-btn" data-filter="G012" aria-pressed="false">
        <span><span class="count-badge" id="count-wg">0</span>مستودع G012</span>
      </button>
    </nav>
  </header>

  <!-- ══════════════════════════════════════════
       TOOLBAR — Search + View Toggle
  ══════════════════════════════════════════ -->
  <nav class="toolbar" role="navigation" aria-label="أدوات التصفح">
    <div class="toolbar-right">
      <div class="search-wrap">
        <input
          id="search-input"
          class="search-input"
          type="search"
          placeholder="ابحث: ورد، طاولات، فازات، فرش، مفرش..."
          aria-label="بحث في الكتالوج"
        />
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="view-toggle" role="group" aria-label="طريقة العرض">
        <button id="view-grid" class="view-btn active" aria-label="عرض شبكي" title="عرض شبكي">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
        </button>
        <button id="view-list" class="view-btn" aria-label="عرض قائمة" title="عرض قائمة">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- ══════════════════════════════════════════
       RESULTS INFO
  ══════════════════════════════════════════ -->
  <div class="results-info" aria-live="polite" aria-atomic="true">
    <span>عرض</span>
    <span class="results-count" id="results-count">0</span>
    <span>نتيجة</span>
  </div>

  <!-- ══════════════════════════════════════════
       CATALOG GRID
  ══════════════════════════════════════════ -->
  <main class="catalog-container" role="main">
    <div
      id="catalog-grid"
      class="catalog-grid"
      role="list"
      aria-label="كتالوج المنتجات"
    >
      <!-- Cards injected by app.js -->
      <div class="loader" aria-label="جاري التحميل">
        <div class="spinner"></div>
        <span>جاري تحميل الكتالوج…</span>
      </div>
    </div>
  </main>

  <!-- ══════════════════════════════════════════
       LIGHTBOX
  ══════════════════════════════════════════ -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="عرض الصورة">
    <div id="lb-backdrop" class="lightbox-backdrop"></div>

    <div class="lightbox-panel">
      <div class="lightbox-header">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <span id="lb-badge" class="lightbox-badge w7">مستودع ٧</span>
          <div style="display:flex;flex-direction:column;gap:2px;">
            <span id="lb-title" class="lightbox-title">اسم الصورة</span>
            <span id="lb-subtitle" class="lightbox-subtitle"></span>
          </div>
        </div>
        <button id="lb-close" class="lightbox-close" aria-label="إغلاق">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="lightbox-body">
        <button id="lb-prev" class="lb-arrow prev" aria-label="السابق">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </button>

        <img id="lb-img" class="lightbox-img" src="" alt="" draggable="false" />

        <button id="lb-next" class="lb-arrow next" aria-label="التالي">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>
      </div>

      <div class="lightbox-footer">
        <div id="lb-dots" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:300px;"></div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       SCROLL TO TOP
  ══════════════════════════════════════════ -->
  <button id="scroll-top" class="scroll-top" aria-label="العودة للأعلى" title="العودة للأعلى">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <path d="M18 15l-6-6-6 6"/>
    </svg>
  </button>

  <!-- ══════════════════════════════════════════
       SCRIPTS
  ══════════════════════════════════════════ -->
  <script src="products.js"></script>
  <script src="app.js"></script>
</body>
</html>
